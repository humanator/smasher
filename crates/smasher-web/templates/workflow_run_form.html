<section class="submit-section">
    <h3>Run</h3>
    <form hx-post="/workflows/{{ workflow.id }}/run" hx-swap="none" class="submit-form">
        <div class="form-group">
            <label for="model">Model</label>
            <input type="text" id="model" name="model" placeholder="(default)">
        </div>
        <div class="form-group">
            <label for="vars">Variables</label>
            <textarea id="vars" name="vars" rows="4" placeholder="key=value"></textarea>
        </div>
        <div class="form-group">
            <label for="brief">Brief</label>
            <textarea id="brief" name="brief" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label for="node_overrides">Node Overrides (JSON)</label>
            <textarea id="node_overrides" name="node_overrides" rows="2" placeholder='{"node_id": {"model": "..."}}'></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Run</button>
    </form>
</section>
