<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SMASHER{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x26A1;</text></svg>">
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
    <script src="/static/htmx.min.js"></script>
    <script src="/static/htmx-ext-sse.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">SMASHER</a>
            <span class="tagline">Pipeline Command</span>
        </div>
    </nav>
    <main class="container" id="main">
        {% block content %}{% endblock %}
    </main>
    <div id="error-toast" class="error-toast" hidden role="alert"></div>
    <script>
        // Any hx-post/hx-get that 4xx/5xxs fires this instead of swapping
        // (htmx's default: error responses aren't swapped into a target),
        // so without this, a failed submission -- e.g. malformed
        // node_overrides JSON on the workflow Run form -- would fail
        // silently with no visible feedback at all.
        document.body.addEventListener('htmx:responseError', function (evt) {
            var xhr = evt.detail.xhr;
            var message = 'Request failed (' + xhr.status + ')';
            try {
                var body = JSON.parse(xhr.responseText);
                if (body && body.error) message = body.error;
            } catch (e) {
                // Non-JSON error body -- fall back to the generic message above.
            }
            var toast = document.getElementById('error-toast');
            toast.textContent = message;
            toast.hidden = false;
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(function () {
                toast.hidden = true;
            }, 6000);
        });
        document.getElementById('error-toast').addEventListener('click', function () {
            this.hidden = true;
        });
    </script>
    <script>
        // Polled sections (marked `data-poll`) echo back the version of the
        // fragment they last rendered so the server can skip the swap
        // (`HX-Reswap: none`) when nothing changed — otherwise every tick
        // would blindly replace the DOM, clearing in-progress typing and
        // reloading any embedded candidate iframe even when there's nothing
        // new. See routes/pages.rs's `poll_response` for the server half.
        document.body.addEventListener('htmx:configRequest', function (evt) {
            var elt = evt.detail.elt;
            if (elt.hasAttribute('data-poll') && elt.dataset.version) {
                evt.detail.headers['X-If-Version'] = elt.dataset.version;
            }
        });
        document.body.addEventListener('htmx:afterRequest', function (evt) {
            var elt = evt.detail.elt;
            if (!elt.hasAttribute('data-poll') || !evt.detail.xhr) return;
            var version = evt.detail.xhr.getResponseHeader('X-Fragment-Version');
            if (version) elt.dataset.version = version;
        });
        // htmx adds .htmx-swapping (a CSS opacity fade, see style.css) to the
        // target on every successful response *before* it looks at whether
        // the swap style is "none" — so an HX-Reswap: none response alone
        // still produces a visible flash on each poll. Cancelling the swap
        // outright here (shouldSwap = false) skips that entirely for a tick
        // the server told us has nothing new.
        document.body.addEventListener('htmx:beforeSwap', function (evt) {
            if (evt.detail.elt.hasAttribute('data-poll') && evt.detail.swapOverride === 'none') {
                evt.detail.shouldSwap = false;
            }
        });
        // Delegated from the document (not attached per-card) because
        // live_card's markup renders inside HTMX-polled fragments that get
        // swapped out and back in; a per-card listener would need
        // re-attaching on every swap. A parent-frame `src` reassignment,
        // never `contentWindow` — the iframe's `sandbox` lacks
        // `allow-same-origin`, so reaching into it would throw.
        document.body.addEventListener('click', function (evt) {
            var btn = evt.target.closest('.candidate-reload-btn');
            if (!btn) return;
            // gallery_gate.html wraps live_card in an <a target="_blank">
            // (click-to-expand the candidate); without this the click bubbles
            // to that anchor and opens the candidate in a new tab instead of
            // reloading the iframe in place.
            evt.preventDefault();
            evt.stopPropagation();
            var iframe = btn.parentElement.querySelector('iframe');
            if (!iframe) return;
            iframe.removeAttribute('src');
            iframe.src = iframe.dataset.src;
        });
    </script>
</body>
</html>
