<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SMASHER{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x26A1;</text></svg>">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
    <script src="/static/htmx-ext-sse.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">SMASHER</a>
            <span class="tagline">Pipeline Command</span>
        </div>
    </nav>
    <main class="container" id="main">
        {% block content %}{% endblock %}
    </main>
    <script>
        // Polled sections (marked `data-poll`) echo back the version of the
        // fragment they last rendered so the server can skip the swap
        // (`HX-Reswap: none`) when nothing changed — otherwise every tick
        // would blindly replace the DOM, clearing in-progress typing and
        // reloading any embedded candidate iframe even when there's nothing
        // new. See routes/pages.rs's `poll_response` for the server half.
        document.body.addEventListener('htmx:configRequest', function (evt) {
            var elt = evt.detail.elt;
            if (elt.hasAttribute('data-poll') && elt.dataset.version) {
                evt.detail.headers['X-If-Version'] = elt.dataset.version;
            }
        });
        document.body.addEventListener('htmx:afterRequest', function (evt) {
            var elt = evt.detail.elt;
            if (!elt.hasAttribute('data-poll') || !evt.detail.xhr) return;
            var version = evt.detail.xhr.getResponseHeader('X-Fragment-Version');
            if (version) elt.dataset.version = version;
        });
    </script>
</body>
</html>
