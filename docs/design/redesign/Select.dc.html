<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Select component</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
select:focus{box-shadow:0 0 0 3px rgba(190,24,93,.35) !important}
</style>
</helmet>
<label style="width:100%;min-width:120px;display:flex;flex-direction:column;gap:4px;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#1D1D1F">
  <sc-if value="{{showLabel}}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;font-weight:500;line-height:1.2">{{label}}</span></sc-if>
  <sc-if value="{{hasHint}}" hint-placeholder-val="{{ false }}"><span style="font-size:11.5px;line-height:1.4;color:#6E6E73;font-weight:400">{{hint}}</span></sc-if>
  <span style="position:relative;display:block;width:100%">
    <select aria-label="{{label}}" value="{{current}}" disabled="{{isDisabled}}" aria-invalid="{{isInvalid}}" onChange="{{onChange}}" style="{{style}}">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.v}}</option></sc-for>
    </select>
    <span aria-hidden="true" style="position:absolute;right:4px;top:4px;width:16px;height:16px;border-radius:4px;background:#BE185D;display:flex;align-items:center;justify-content:center;pointer-events:none">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.5l5-5 5 5M7 14.5l5 5 5-5"/></svg>
    </span>
  </span>
</label>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Model"},"hideLabel":{"editor":"boolean","default":false},"hint":{"editor":"text","default":""},"value":{"editor":"text","default":""},"options":{"editor":"text","default":"claude-sonnet-4-5|claude-opus-4-1|gpt-5"},"state":{"editor":"enum","default":"default","options":["default","focus","invalid","disabled"]},"onInput":{"editor":null},"$preview":{"width":320,"height":84}}'>
// macOS pop-up button. Same API as the shadcn native-select it replaces.
// `options` is a pipe-separated list.
const BASE = 'box-sizing:border-box;height:24px;width:100%;padding:0 28px 0 9px;appearance:none;-webkit-appearance:none;border-radius:6px;background:#FFFFFF;border:0;box-shadow:0 0 0 .5px rgba(0,0,0,.16),0 .5px 1.5px rgba(0,0,0,.14);font-family:inherit;font-size:13px;color:#1D1D1F;outline:none;';
const STATE = {
  default: '',
  focus: 'box-shadow:0 0 0 3px rgba(190,24,93,.35);',
  invalid: 'box-shadow:0 0 0 1px #FF3B30,0 0 0 4px rgba(255,59,48,.22);',
  disabled: 'opacity:.45;cursor:not-allowed;'
};
class Component extends DCLogic {
  state = { v: null };
  renderVals() {
    const p = this.props;
    const s = STATE[p.state] !== undefined ? p.state : 'default';
    const opts = String(p.options ?? 'claude-sonnet-4-5|claude-opus-4-1|gpt-5').split('|').map((x) => x.trim()).filter(Boolean);
    const controlled = typeof p.onInput === 'function';
    return {
      label: p.label ?? 'Model', showLabel: !p.hideLabel, hint: p.hint ?? '', hasHint: !!p.hint,
      opts: opts.map((v) => ({ v })),
      current: controlled ? (p.value || opts[0] || '') : (this.state.v ?? (p.value || opts[0] || '')),
      onChange: (e) => { if (controlled) p.onInput(e.target.value); else this.setState({ v: e.target.value }); },
      isDisabled: s === 'disabled', isInvalid: s === 'invalid',
      style: BASE + STATE[s]
    };
  }
}
</script>
</body>
</html>
