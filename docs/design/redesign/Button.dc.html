<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Button component</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button:focus-visible,a:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(190,24,93,.4) !important}
</style>
</helmet>
<span style="{{wrapStyle}}">
  <sc-if value="{{isLink}}" hint-placeholder-val="{{ false }}">
    <a href="{{href}}" aria-label="{{ariaLabel}}" style="{{style}}">
      <sc-if value="{{iconStart}}" hint-placeholder-val="{{ false }}"><svg width="{{iconPx}}" height="{{iconPx}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{iconPath}}"/></svg></sc-if>
      <sc-if value="{{showLabel}}" hint-placeholder-val="{{ true }}"><span>{{label}}</span></sc-if>
      <sc-if value="{{iconEnd}}" hint-placeholder-val="{{ false }}"><svg width="{{iconPx}}" height="{{iconPx}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{iconPath}}"/></svg></sc-if>
    </a>
  </sc-if>
  <sc-if value="{{isButton}}" hint-placeholder-val="{{ true }}">
    <button type="button" disabled="{{disabled}}" aria-label="{{ariaLabel}}" title="{{tip}}" aria-pressed="{{pressed}}" aria-expanded="{{expanded}}" onClick="{{onPress}}" style="{{style}}">
      <sc-if value="{{iconStart}}" hint-placeholder-val="{{ false }}"><svg width="{{iconPx}}" height="{{iconPx}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{iconPath}}"/></svg></sc-if>
      <sc-if value="{{showLabel}}" hint-placeholder-val="{{ true }}"><span>{{label}}</span></sc-if>
      <sc-if value="{{iconEnd}}" hint-placeholder-val="{{ false }}"><svg width="{{iconPx}}" height="{{iconPx}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{iconPath}}"/></svg></sc-if>
    </button>
  </sc-if>
</span>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"default","options":["default","outline","secondary","ghost","destructive","link"]},"size":{"editor":"enum","default":"default","options":["xs","sm","default","lg","icon-xs","icon-sm","icon","icon-lg"]},"label":{"editor":"text","default":"Button"},"icon":{"editor":"enum","default":"none","options":["none","plus","play","arrow","check","trash","x","settings","upload","minus","help","search","sidebar","inspector","stop","back","forward","folder","share","more","refresh"]},"iconPosition":{"editor":"enum","default":"start","options":["start","end"]},"disabled":{"editor":"boolean","default":false},"fullWidth":{"editor":"boolean","default":false},"href":{"editor":"text","default":""},"pressed":{"editor":null},"expanded":{"editor":null},"onPress":{"editor":null},"$preview":{"width":140,"height":40}}'>
// macOS push button. Same API as the shadcn-svelte button it replaces:
// default = accent-filled default button, outline = standard push button, secondary = recessed,
// ghost = borderless toolbar button, destructive = push button with red text, link = accent text.
// `onPress` is a callback; `href` renders an anchor instead of a button.
const BASE = 'box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;border-radius:6px;font-family:inherit;font-weight:400;font-size:13px;line-height:1;letter-spacing:-.005em;white-space:nowrap;text-decoration:none;cursor:default;';
const PUSH = 'box-shadow:0 0 0 .5px rgba(0,0,0,.16),0 .5px 1.5px rgba(0,0,0,.14);';
const VARIANT = {
  default: 'background:#BE185D;color:#FFFFFF;font-weight:500;box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 .5px 1.5px rgba(0,0,0,.18),inset 0 .5px 0 rgba(255,255,255,.22);',
  outline: 'background:#FFFFFF;color:#1D1D1F;' + PUSH,
  secondary: 'background:rgba(0,0,0,.06);color:#1D1D1F;',
  ghost: 'background:transparent;color:#4A4A4F;',
  destructive: 'background:#FFFFFF;color:#C4170F;' + PUSH,
  link: 'background:transparent;color:#BE185D;padding-left:0!important;padding-right:0!important;'
};
const SIZE = {
  xs: 'height:18px;padding:0 7px;font-size:11px;border-radius:5px;',
  sm: 'height:22px;padding:0 9px;',
  default: 'height:24px;padding:0 11px;',
  lg: 'height:28px;padding:0 14px;',
  'icon-xs': 'width:18px;height:18px;padding:0;border-radius:5px;',
  'icon-sm': 'width:24px;height:24px;padding:0;',
  icon: 'width:28px;height:28px;padding:0;',
  'icon-lg': 'width:32px;height:32px;padding:0;'
};
const ICON = {
  plus: 'M12 5v14M5 12h14', play: 'M8 5l11 7-11 7z', arrow: 'M5 12h14M13 6l6 6-6 6',
  check: 'M20 6L9 17l-5-5', trash: 'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6', x: 'M18 6L6 18M6 6l12 12',
  minus: 'M5 12h14', help: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01',
  upload: 'M12 15V3M7 8l5-5 5 5M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5',
  search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4',
  sidebar: 'M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM9 5v14',
  inspector: 'M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM15 5v14',
  stop: 'M7 7h10v10H7z', back: 'M15 5l-7 7 7 7', forward: 'M9 5l7 7-7 7',
  folder: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  share: 'M12 3v12M7 8l5-5 5 5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7',
  more: 'M6 12h.01M12 12h.01M18 12h.01', refresh: 'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7',
  settings: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z'
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const variant = VARIANT[p.variant] ? p.variant : 'default';
    const size = SIZE[p.size] ? p.size : 'default';
    const iconOnly = size.indexOf('icon') === 0;
    const icon = iconOnly && (!p.icon || p.icon === 'none') ? 'plus' : (p.icon || 'none');
    const hasIcon = icon !== 'none' && !!ICON[icon];
    const label = p.label ?? 'Button';
    const href = p.href || '';
    const small = size === 'xs' || size === 'icon-xs';
    const on = p.pressed === true;
    return {
      wrapStyle: 'display:' + (p.fullWidth ? 'flex;width:100%' : 'inline-flex') + ';font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif',
      style: BASE + VARIANT[variant] + SIZE[size] + (p.fullWidth ? 'width:100%;' : '') + (on && variant === 'ghost' ? 'background:rgba(0,0,0,.08);color:#1D1D1F;' : '') + (p.disabled ? 'opacity:.4;pointer-events:none;' : ''),
      label, href, disabled: !!p.disabled, tip: iconOnly ? label : undefined,
      pressed: p.pressed, expanded: p.expanded, onPress: p.onPress,
      ariaLabel: iconOnly ? label : undefined,
      isLink: !!href, isButton: !href,
      showLabel: !iconOnly,
      iconStart: hasIcon && (iconOnly || (p.iconPosition || 'start') === 'start'),
      iconEnd: hasIcon && !iconOnly && p.iconPosition === 'end',
      iconPath: hasIcon ? ICON[icon] : '', iconPx: small ? 11 : (iconOnly && size !== 'icon-sm' ? 16 : 13)
    };
  }
}
</script>
</body>
</html>
