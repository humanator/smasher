<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Checkbox component</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<label style="{{rowStyle}}">
  <input type="checkbox" checked="{{isChecked}}" disabled="{{isDisabled}}" aria-invalid="{{isInvalid}}" aria-label="{{ariaLabel}}" onChange="{{onToggle}}" style="position:absolute;opacity:0;width:14px;height:14px;margin:0">
  <span style="{{boxStyle}}" aria-hidden="true"><sc-if value="{{isChecked}}" hint-placeholder-val="{{ false }}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></sc-if></span>
  <sc-if value="{{showLabel}}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;line-height:1.2">{{label}}</span></sc-if>
</label>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Checkbox"},"hideLabel":{"editor":"boolean","default":false},"checked":{"editor":"boolean","default":false},"state":{"editor":"enum","default":"default","options":["default","invalid","disabled"]},"onToggle":{"editor":null},"$preview":{"width":200,"height":24}}'>
// macOS check box. Same API as the shadcn checkbox it replaces.
// Give it `onToggle` (called with the new true/false) to control it from a screen.
class Component extends DCLogic {
  state = { c: null };
  renderVals() {
    const p = this.props;
    const s = p.state || 'default';
    const controlled = typeof p.onToggle === 'function';
    const checked = controlled ? !!p.checked : (this.state.c ?? !!p.checked);
    return {
      label: p.label ?? 'Checkbox', showLabel: !p.hideLabel, ariaLabel: p.label ?? 'Checkbox',
      isChecked: checked, isDisabled: s === 'disabled', isInvalid: s === 'invalid',
      onToggle: () => { if (controlled) p.onToggle(!checked); else this.setState({ c: !checked }); },
      rowStyle: 'position:relative;display:inline-flex;align-items:center;gap:7px;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#1D1D1F;cursor:default;opacity:' + (s === 'disabled' ? .45 : 1),
      boxStyle: 'box-sizing:border-box;flex:none;width:14px;height:14px;border-radius:3.5px;display:inline-flex;align-items:center;justify-content:center;color:#FFFFFF;'
        + (checked ? 'background:#BE185D;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15);' : 'background:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22),0 .5px 1px rgba(0,0,0,.08);')
        + (s === 'invalid' ? 'box-shadow:inset 0 0 0 1px #FF3B30,0 0 0 3px rgba(255,59,48,.22);' : '')
    };
  }
}
</script>
</body>
</html>
