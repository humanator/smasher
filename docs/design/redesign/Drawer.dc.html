<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Drawer component</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(190,24,93,.4) !important}
</style>
</helmet>
<div style="{{rootStyle}}">
  <button type="button" aria-expanded="{{isOpen}}" onClick="{{toggle}}" style="{{triggerStyle}}">{{triggerLabel}}</button>
  <sc-if value="{{isOpen}}" hint-placeholder-val="{{ true }}">
    <div style="{{scrimStyle}}" onClick="{{close}}"></div>
    <div role="dialog" aria-modal="true" aria-label="{{title}}" style="{{panelStyle}}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
        <div style="min-width:0">
          <div style="font-size:13px;font-weight:700;line-height:1.3">{{title}}</div>
          <sc-if value="{{hasDesc}}" hint-placeholder-val="{{ true }}"><div style="margin-top:3px;font-size:12px;line-height:1.45;color:#6E6E73">{{description}}</div></sc-if>
        </div>
        <sc-if value="{{showClose}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Close" onClick="{{close}}" style="flex:none;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:rgba(0,0,0,.06);color:#4A4A4F;cursor:default"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></sc-if>
      </div>
      <sc-if value="{{hasBody}}" hint-placeholder-val="{{ true }}"><div style="margin-top:12px;font-size:13px;line-height:1.5;color:#1D1D1F">{{body}}</div></sc-if>
      <div style="margin-top:auto;padding-top:18px;display:flex;justify-content:flex-end;gap:8px">
        <sc-if value="{{hasSecondary}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{close}}" style="height:24px;min-width:72px;padding:0 11px;border:0;border-radius:6px;background:#FFFFFF;box-shadow:0 0 0 .5px rgba(0,0,0,.16),0 .5px 1.5px rgba(0,0,0,.14);color:#1D1D1F;font:inherit;font-size:13px;cursor:default">{{secondaryLabel}}</button></sc-if>
        <button type="button" onClick="{{confirm}}" style="height:24px;min-width:72px;padding:0 11px;border:0;border-radius:6px;background:#BE185D;box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 .5px 1.5px rgba(0,0,0,.18);color:#FFFFFF;font:inherit;font-size:13px;font-weight:500;cursor:default">{{primaryLabel}}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props="{&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Run details&quot;},&quot;description&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Everything about this run, out of the way until you need it.&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Started 9:41 am. Three candidates drafted, two scored above 80. Estimated cost A$0.65.&quot;},&quot;direction&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;bottom&quot;,&quot;options&quot;:[&quot;bottom&quot;,&quot;right&quot;,&quot;left&quot;,&quot;top&quot;]},&quot;triggerLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Open drawer&quot;},&quot;primaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Done&quot;},&quot;secondaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Cancel&quot;},&quot;showClose&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;contained&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;onToggle&quot;:{&quot;editor&quot;:null},&quot;onConfirm&quot;:{&quot;editor&quot;:null},&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:420}}">
// macOS sheet (top/bottom) or inspector panel (left/right). Same API as the shadcn drawer it replaces.
// `contained` keeps it inside this component's frame (good for boards); turn it off to cover the whole screen when imported into a screen.
// `open` is the starting state; give it onToggle(newBool) to control it.
class Component extends DCLogic {
  state = { o: null };
  renderVals() {
    const p = this.props;
    const controlled = typeof p.onToggle === 'function';
    const open = controlled ? !!p.open : (this.state.o ?? !!p.open);
    const set = (v) => { if (controlled) p.onToggle(v); else this.setState({ o: v }); };
    const dir = ['bottom', 'right', 'left', 'top'].indexOf(p.direction) >= 0 ? p.direction : 'bottom';
    const pos = p.contained === false ? 'fixed' : 'absolute';
    const edge = (dir === 'bottom' || dir === 'top') ? 'left:50%;top:40px;transform:translateX(-50%);width:calc(100% - 48px);max-width:420px;max-height:80%;border-radius:12px;'
      : dir === 'right' ? 'top:0;bottom:0;right:0;width:75%;max-width:300px;border-left:1px solid rgba(0,0,0,.1);'
      : 'top:0;bottom:0;left:0;width:75%;max-width:300px;border-right:1px solid rgba(0,0,0,.1);';
    const sheet = dir === 'bottom' || dir === 'top';
    return {
      title: p.title ?? '', description: p.description ?? '', hasDesc: !!p.description, body: p.body ?? '', hasBody: !!p.body,
      triggerLabel: p.triggerLabel || 'Open drawer', primaryLabel: p.primaryLabel || 'Done',
      secondaryLabel: p.secondaryLabel ?? '', hasSecondary: !!p.secondaryLabel,
      isOpen: open, showClose: !!p.showClose,
      toggle: () => set(!open), close: () => set(false),
      confirm: () => { if (typeof p.onConfirm === 'function') p.onConfirm(); set(false); },
      rootStyle: 'position:relative;width:100%;height:100%;min-height:' + (p.contained === false ? 0 : 380) + 'px;overflow:' + (p.contained === false ? 'visible' : 'hidden') + ';font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#1D1D1F;background:' + (p.contained === false ? 'transparent' : '#F5F5F7') + ';',
      triggerStyle: 'margin:16px;height:24px;padding:0 11px;border-radius:6px;border:0;background:#FFFFFF;box-shadow:0 0 0 .5px rgba(0,0,0,.16),0 .5px 1.5px rgba(0,0,0,.14);font:inherit;font-size:13px;color:#1D1D1F;cursor:default;',
      scrimStyle: 'position:' + pos + ';inset:0;z-index:20;background:rgba(0,0,0,' + (sheet ? '.18' : '0') + ');',
      panelStyle: 'position:' + pos + ';z-index:21;box-sizing:border-box;display:flex;flex-direction:column;padding:18px 20px 16px;background:' + (sheet ? '#FFFFFF' : '#F7F7F9') + ';box-shadow:' + (sheet ? '0 0 0 .5px rgba(0,0,0,.18),0 20px 50px rgba(0,0,0,.28)' : 'none') + ';' + edge
    };
  }
}
</script>
</body>
</html>
