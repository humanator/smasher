<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Sidebar component</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(190,24,93,.4)}
</style>
</helmet>
<aside style="{{asideStyle}}">
  <div style="{{headStyle}}">
    <span aria-hidden="true" style="display:flex;gap:8px">
      <span style="width:12px;height:12px;border-radius:50%;background:#FF5F57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#FEBC2E;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#28C840;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)"></span>
    </span>
    <button type="button" aria-label="Toggle sidebar" aria-expanded="{{expanded}}" onClick="{{toggle}}" style="flex:none;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:#4A4A4F;cursor:default"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM9 5v14"/></svg></button>
  </div>
  <sc-if value="{{expanded}}" hint-placeholder-val="{{ true }}"><div style="padding:6px 18px 4px;font-size:11px;font-weight:600;color:#636368">{{title}}</div></sc-if>
  <nav style="flex:1;display:flex;flex-direction:column;gap:1px;padding:0 10px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <button type="button" title="{{it.label}}" aria-current="{{it.active}}" onClick="{{it.onPress}}" style="{{it.style}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#BE185D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="{{it.icon}}"/></svg>
        <sc-if value="{{expanded}}" hint-placeholder-val="{{ true }}"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{it.label}}</span></sc-if>
      </button>
    </sc-for>
  </nav>
  <sc-if value="{{showFooter}}" hint-placeholder-val="{{ false }}"><div style="padding:10px 18px;font-size:11px;line-height:1.4;color:#636368">{{footer}}</div></sc-if>
</aside>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Smasher"},"items":{"editor":"text","default":"Dashboard:home|Workflows:flow|Runs:play|Settings:settings"},"active":{"editor":"text","default":"Dashboard"},"footer":{"editor":"text","default":"3 runs need your decision"},"side":{"editor":"enum","default":"left","options":["left","right"]},"collapsed":{"editor":"boolean","default":false},"width":{"editor":"number","default":220},"onSelect":{"editor":null},"onToggle":{"editor":null},"$preview":{"width":256,"height":420}}'>
// macOS source-list sidebar with window controls. Same API as the shadcn sidebar it replaces.
// `items` is "Label:icon" pairs separated by |. Icons: home, flow, play, settings, layers, list, user.
// `collapsed` is the starting state; give it onToggle(newBool) to control it. Give it onSelect(label) to drive navigation.
const ICON = {
  home: 'M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  flow: 'M6 3v12M18 9v12M6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM18 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  play: 'M8 5l11 7-11 7z',
  settings: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z',
  layers: 'M12 2l10 5-10 5L2 7zM2 17l10 5 10-5M2 12l10 5 10-5',
  list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
  user: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'
};
class Component extends DCLogic {
  state = { c: null, a: null };
  renderVals() {
    const p = this.props;
    const tControlled = typeof p.onToggle === 'function';
    const collapsed = tControlled ? !!p.collapsed : (this.state.c ?? !!p.collapsed);
    const sControlled = typeof p.onSelect === 'function';
    const cur = sControlled ? p.active : (this.state.a ?? p.active);
    const w = collapsed ? 76 : (p.width || 220);
    const right = p.side === 'right';
    const rows = String(p.items ?? '').split('|').map((x) => x.trim()).filter(Boolean).map((x) => {
      const i = x.lastIndexOf(':');
      return i < 0 ? { l: x, i: 'list' } : { l: x.slice(0, i).trim(), i: x.slice(i + 1).trim() };
    });
    return {
      title: p.title ?? '', footer: p.footer ?? '', showFooter: !!p.footer && !collapsed, expanded: !collapsed,
      toggle: () => { if (tControlled) p.onToggle(!collapsed); else this.setState({ c: !collapsed }); },
      asideStyle: 'box-sizing:border-box;display:flex;flex-direction:column;width:' + w + 'px;height:100%;background:#EBEBEE;color:#1D1D1F;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;' + (right ? 'border-left' : 'border-right') + ':1px solid rgba(0,0,0,.08);transition:width .15s;',
      headStyle: 'box-sizing:border-box;height:52px;flex:none;display:flex;align-items:center;' + (collapsed ? 'flex-direction:column;justify-content:center;gap:8px;height:76px;' : 'justify-content:space-between;') + 'padding:0 ' + (collapsed ? 0 : 12) + 'px 0 ' + (collapsed ? 0 : 20) + 'px;',
      items: rows.map((r) => {
        const on = r.l === cur;
        return {
          label: r.l, icon: ICON[r.i] || ICON.list, active: on,
          onPress: () => { if (sControlled) p.onSelect(r.l); else this.setState({ a: r.l }); },
          style: 'box-sizing:border-box;height:28px;display:flex;align-items:center;justify-content:' + (collapsed ? 'center' : 'flex-start') + ';gap:8px;padding:0 ' + (collapsed ? 0 : 8) + 'px;border:0;border-radius:6px;font:inherit;font-size:13px;cursor:default;text-align:left;color:#1D1D1F;background:' + (on ? 'rgba(0,0,0,.09)' : 'transparent') + ';'
        };
      })
    };
  }
}
</script>
</body>
</html>
