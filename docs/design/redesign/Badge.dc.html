<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Badge component</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span style="display:inline-flex;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><span style="{{style}}"><sc-if value="{{hasDot}}" hint-placeholder-val="{{ false }}"><span style="{{dotStyle}}" aria-hidden="true"></span></sc-if>{{label}}</span></span>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"default","options":["default","secondary","destructive","outline","ghost","link"]},"label":{"editor":"text","default":"Badge"},"dot":{"editor":"color","default":""},"$preview":{"width":80,"height":24}}'>
// macOS-style status capsule. Same API as the shadcn badge it replaces.
// `dot` is an optional status colour dot.
const BASE = 'box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:5px;height:18px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:500;line-height:1;white-space:nowrap;';
const VARIANT = {
  default: 'background:#BE185D;color:#FFFFFF;',
  secondary: 'background:rgba(0,0,0,.06);color:#1D1D1F;',
  destructive: 'background:rgba(255,59,48,.12);color:#C4170F;',
  outline: 'box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);color:#3A3A3C;',
  ghost: 'background:transparent;color:#1D1D1F;',
  link: 'color:#BE185D;'
};
class Component extends DCLogic {
  renderVals() {
    const v = VARIANT[this.props.variant] ? this.props.variant : 'default';
    const dot = this.props.dot || '';
    return { style: BASE + VARIANT[v], label: this.props.label ?? 'Badge', hasDot: !!dot,
      dotStyle: 'flex:none;width:6px;height:6px;border-radius:50%;background:' + (dot || 'transparent') };
  }
}
</script>
</body>
</html>
