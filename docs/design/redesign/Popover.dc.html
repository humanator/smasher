<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Popover component</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(190,24,93,.4) !important}
</style>
</helmet>
<span style="{{wrapStyle}}">
  <button type="button" aria-expanded="{{isOpen}}" aria-label="{{label}}" onClick="{{onPress}}" style="{{triggerStyle}}">
    <sc-if value="{{hasLabel}}" hint-placeholder-val="{{ true }}"><span>{{label}}</span></sc-if>
    <sc-if value="{{noLabel}}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:600">?</span></sc-if>
  </button>
  <sc-if value="{{isOpen}}" hint-placeholder-val="{{ true }}">
    <div role="dialog" aria-label="{{title}}" style="{{panelStyle}}">
      <span aria-hidden="true" style="{{arrowStyle}}"></span>
      <sc-if value="{{hasTitle}}" hint-placeholder-val="{{ true }}"><div style="font-size:13px;font-weight:600;line-height:1.3;margin-bottom:3px">{{title}}</div></sc-if>
      <div style="font-size:12px;line-height:1.45;color:#6E6E73">{{body}}</div>
    </div>
  </sc-if>
</span>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Details"},"title":{"editor":"text","default":"Prompt"},"body":{"editor":"text","default":"The instruction the AI follows. Describe the job, the tone and what a good answer looks like."},"align":{"editor":"enum","default":"start","options":["start","end"]},"width":{"editor":"number","default":280},"open":{"editor":"boolean","default":false},"onToggle":{"editor":null},"$preview":{"width":340,"height":180}}'>
// macOS popover with its arrow. Same API as the shadcn popover it replaces. Leave `label` empty for a round "?" help button.
// `open` is the starting state; give it onToggle(newBool) to control it.
class Component extends DCLogic {
  state = { o: null };
  renderVals() {
    const p = this.props;
    const controlled = typeof p.onToggle === 'function';
    const open = controlled ? !!p.open : (this.state.o ?? !!p.open);
    const lab = p.label ?? '';
    const end = p.align === 'end';
    return {
      label: lab || 'More info', hasLabel: !!lab, noLabel: !lab, title: p.title ?? '', hasTitle: !!p.title, body: p.body ?? '',
      isOpen: open,
      onPress: () => { if (controlled) p.onToggle(!open); else this.setState({ o: !open }); },
      wrapStyle: 'position:relative;display:inline-flex;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#1D1D1F;',
      triggerStyle: 'box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;height:' + (lab ? 24 : 20) + 'px;' + (lab ? 'padding:0 11px;border-radius:6px;' : 'width:20px;border-radius:50%;') + 'border:0;background:' + (open ? '#F0F0F2' : '#FFFFFF') + ';box-shadow:0 0 0 .5px rgba(0,0,0,.16),0 .5px 1.5px rgba(0,0,0,.14);font:inherit;font-size:13px;color:#1D1D1F;cursor:default;',
      arrowStyle: 'position:absolute;top:-6px;' + (end ? 'right:14px;' : 'left:14px;') + 'width:12px;height:12px;background:#FFFFFF;transform:rotate(45deg);box-shadow:-.5px -.5px 0 rgba(0,0,0,.14);',
      panelStyle: 'position:absolute;top:calc(100% + 10px);' + (end ? 'right:-4px;' : 'left:-4px;') + 'z-index:10;box-sizing:border-box;width:' + (p.width || 280) + 'px;padding:12px 14px;border-radius:10px;background:#FFFFFF;box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 10px 30px rgba(0,0,0,.18);'
    };
  }
}
</script>
</body>
</html>
