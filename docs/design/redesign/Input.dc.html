<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Input component</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
input::placeholder{color:#8E8E93}
input:focus{border-color:#BE185D !important;box-shadow:0 0 0 3px rgba(190,24,93,.3) !important}
</style>
</helmet>
<label style="width:100%;min-width:120px;display:flex;flex-direction:column;gap:4px;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#1D1D1F">
  <sc-if value="{{showLabel}}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;font-weight:500;line-height:1.2">{{label}}</span></sc-if>
  <sc-if value="{{hasHint}}" hint-placeholder-val="{{ false }}"><span style="font-size:11.5px;line-height:1.4;color:#6E6E73;font-weight:400">{{hint}}</span></sc-if>
  <span style="position:relative;display:block;width:100%">
    <sc-if value="{{isSearch}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position:absolute;left:8px;top:50%;margin-top:-6.5px;pointer-events:none"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg></sc-if>
    <input type="{{kind}}" aria-label="{{label}}" value="{{current}}" placeholder="{{placeholder}}" disabled="{{isDisabled}}" aria-invalid="{{isInvalid}}" autocomplete="off" spellcheck="false" onChange="{{onChange}}" style="{{style}}">
  </span>
  <sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size:11.5px;color:#C4170F;font-weight:400">{{error}}</span></sc-if>
</label>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Label"},"hideLabel":{"editor":"boolean","default":false},"hint":{"editor":"text","default":""},"value":{"editor":"text","default":""},"placeholder":{"editor":"text","default":"Type here"},"type":{"editor":"enum","default":"text","options":["text","password"]},"mono":{"editor":"boolean","default":false},"search":{"editor":"boolean","default":false},"state":{"editor":"enum","default":"default","options":["default","focus","invalid","disabled"]},"error":{"editor":"text","default":""},"onInput":{"editor":null},"$preview":{"width":320,"height":84}}'>
// macOS text field (or a toolbar search field with `search`). Same API as the shadcn input it replaces.
// Wrapped in a <label>, so clicking the label focuses the field. Give it `onInput` to control the value from a screen.
const BASE = 'box-sizing:border-box;height:24px;width:100%;padding:0 8px;border-radius:6px;background:#FFFFFF;border:1px solid rgba(0,0,0,.14);box-shadow:inset 0 .5px 1px rgba(0,0,0,.05);font-family:inherit;font-size:13px;color:#1D1D1F;outline:none;';
const SEARCH = 'height:28px;padding-left:26px;background:rgba(0,0,0,.05);border-color:transparent;box-shadow:none;border-radius:7px;';
const STATE = {
  default: '',
  focus: 'border-color:#BE185D;box-shadow:0 0 0 3px rgba(190,24,93,.3);',
  invalid: 'border-color:#FF3B30;box-shadow:0 0 0 3px rgba(255,59,48,.22);',
  disabled: 'opacity:.45;cursor:not-allowed;'
};
class Component extends DCLogic {
  state = { v: null };
  renderVals() {
    const p = this.props;
    const s = STATE[p.state] !== undefined ? p.state : 'default';
    const controlled = typeof p.onInput === 'function';
    return {
      label: p.label ?? 'Label', showLabel: !p.hideLabel,
      hint: p.hint ?? '', hasHint: !!p.hint, isSearch: !!p.search,
      kind: p.type || 'text', placeholder: p.placeholder ?? '',
      current: controlled ? (p.value ?? '') : (this.state.v ?? p.value ?? ''),
      onChange: (e) => { if (controlled) p.onInput(e.target.value); else this.setState({ v: e.target.value }); },
      isDisabled: s === 'disabled', isInvalid: s === 'invalid',
      style: BASE + (p.search ? SEARCH : '') + (p.mono ? 'font-family:ui-monospace,Menlo,monospace;font-size:12px;' : '') + STATE[s],
      hasError: s === 'invalid' && !!p.error, error: p.error ?? ''
    };
  }
}
</script>
</body>
</html>
