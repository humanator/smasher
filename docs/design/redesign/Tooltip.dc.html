<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Tooltip component</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(190,24,93,.4) !important}
</style>
</helmet>
<span style="{{wrapStyle}}" onMouseEnter="{{show}}" onMouseLeave="{{hide}}" onFocus="{{show}}" onBlur="{{hide}}">
  <button type="button" aria-label="{{text}}" style="{{triggerStyle}}">
    <sc-if value="{{hasTrigger}}" hint-placeholder-val="{{ true }}"><span>{{trigger}}</span></sc-if>
    <sc-if value="{{noTrigger}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></sc-if>
  </button>
  <sc-if value="{{isOpen}}" hint-placeholder-val="{{ true }}"><span role="tooltip" style="{{bubbleStyle}}">{{text}}</span></sc-if>
</span>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"text":{"editor":"text","default":"Tests how well the draft matches your brief"},"trigger":{"editor":"text","default":"Score"},"side":{"editor":"enum","default":"top","options":["top","bottom"]},"open":{"editor":"boolean","default":false},"$preview":{"width":320,"height":90}}'>
// macOS help tag (tooltip). Same API as the shadcn tooltip it replaces. Shows on hover or keyboard focus; `open` pins it open for design review.
// Leave `trigger` empty for an info icon.
class Component extends DCLogic {
  state = { h: false };
  renderVals() {
    const p = this.props;
    const top = p.side !== 'bottom';
    const trig = p.trigger ?? '';
    return {
      text: p.text ?? '', trigger: trig, hasTrigger: !!trig, noTrigger: !trig,
      isOpen: !!p.open || this.state.h,
      show: () => this.setState({ h: true }), hide: () => this.setState({ h: false }),
      wrapStyle: 'position:relative;display:inline-flex;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;',
      triggerStyle: 'display:inline-flex;align-items:center;gap:4px;padding:' + (trig ? '0 8px' : '0') + ';height:20px;border-radius:5px;border:' + (trig ? '1px dashed rgba(0,0,0,.2)' : '0') + ';background:transparent;font:inherit;font-size:11px;color:#6E6E73;cursor:default;',
      bubbleStyle: 'position:absolute;left:50%;transform:translateX(-50%);' + (top ? 'bottom:calc(100% + 6px);' : 'top:calc(100% + 6px);') + 'z-index:10;width:max-content;max-width:280px;padding:4px 8px;border-radius:5px;background:#F6F6F6;color:#1D1D1F;font-size:11px;line-height:1.35;box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.14);pointer-events:none;'
    };
  }
}
</script>
</body>
</html>
