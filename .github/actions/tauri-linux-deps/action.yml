# ABOUTME: Installs the WebKitGTK/GTK system libraries Tauri needs to compile on Linux runners.
# ABOUTME: Required by every job that builds the workspace, since smasher-desktop is a member.
name: Tauri Linux deps
description: Install the apt packages smasher-desktop (Tauri 2) needs to compile on Ubuntu.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
