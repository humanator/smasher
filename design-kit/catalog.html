<!doctype html>
<html lang="en">
<head>
  <!-- ABOUTME: Style-guide / demo page for every design-kit component and its states. -->

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design Kit Catalog</title>
  <link rel="stylesheet" href="../crates/smasher-web/static/style.css" />

  <style>
    body {
      background: var(--bg-base);
      color: var(--text-primary);

      margin-top: 2rem;
    }
