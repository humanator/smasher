<!doctype html>
<html lang="en">
<head>
  <!-- ABOUTME: Style-guide / demo page for every design-kit component and its states. -->
  <!-- ABOUTME: Opened directly in a browser (or via a Playwright file:// URL) — no server needed. -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design Kit Catalog</title>
  <link rel="stylesheet" href="../crates/smasher-web/static/style.css" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-body);
    }
    .catalog-header {
      padding: var(--radius-lg) var(--radius-lg) 0;
      max-width: var(--container-max);
      margin: 0 auto;
    }
    .catalog-header h1 {
      font-family: var(--font-display);
    }
    .catalog-body {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 var(--radius-lg) 3rem;
    }
    .catalog-section {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header class="catalog-header">
    <h1>Component Kit</h1>
    <p>Design-factory component catalog — button, input, drawer, modal, list-row.</p>
  </header>
  <main class="catalog-body">
    <section class="catalog-section">
      <h2>Button</h2>
      <button class="btn" type="button">Default action</button>
      <button class="btn btn-primary" type="button">Primary action</button>
      <button class="btn btn-small" type="button">Small action</button>
      <button class="btn" type="button" disabled>Disabled action</button>
    </section>

    <section class="catalog-section">
      <h2>Input</h2>
      <div class="field">
        <label for="example-input">Example input</label>
        <input class="input" type="text" id="example-input" placeholder="Type something…" />
      </div>
    </section>

    <section class="catalog-section">
      <h2>List-row</h2>
      <ul class="list">
        <li class="list-row">Plain row — no action</li>
        <li class="list-row list-row-action" tabindex="0" role="button" aria-pressed="false">
          Actionable row — press Enter or Space
        </li>
      </ul>
    </section>

    <section class="catalog-section">
      <h2>Drawer</h2>
      <button class="btn" type="button" data-drawer-trigger="example-drawer">Open drawer</button>

      <div class="drawer-overlay" data-drawer-overlay="example-drawer" hidden></div>
      <div class="drawer" id="example-drawer" role="dialog" aria-modal="true" aria-label="Example drawer" hidden>
        <div class="drawer-header">
          <h3>Example drawer</h3>
          <button class="btn btn-small" type="button" data-drawer-close="example-drawer">Close</button>
        </div>
        <div class="drawer-body">
          <p>Drawer content goes here.</p>
          <input class="input" type="text" placeholder="Focusable field inside the drawer" />
        </div>
      </div>
    </section>

    <section class="catalog-section">
      <h2>Modal</h2>
      <button class="btn" type="button" data-modal-trigger="example-modal">Open modal</button>

      <div class="modal-overlay" data-modal-overlay="example-modal" hidden></div>
      <div class="modal" id="example-modal" role="dialog" aria-modal="true" aria-label="Example modal" hidden>
        <div class="modal-header">
          <h3>Example modal</h3>
          <button class="btn btn-small" type="button" data-modal-close="example-modal">Close</button>
        </div>
        <div class="modal-body">
          <p>Modal content goes here.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" type="button" data-modal-close="example-modal">Confirm</button>
        </div>
      </div>
    </section>
  </main>
  <script src="components.js" defer></script>
</body>
</html>
